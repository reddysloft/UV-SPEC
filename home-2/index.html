<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultraviolette Automotive</title>
  <meta
    name="description"
    content="Ultraviolette Automotive — Tesseract and Shockwave."
  />
  <link rel="preload" as="image" href="../Homepage%202.png" />
  <link rel="stylesheet" href="../css/style.css?v=12" />
</head>
<body>
  <!-- Second homepage: uploaded image used exactly as provided, unmodified. -->
  <section class="hero" aria-label="Ultraviolette Automotive — second lineup">
    <div class="hero__media">
      <img
        class="hero__image"
        src="../Homepage%202.png"
        width="4269"
        height="2400"
        alt="Ultraviolette Automotive — Tesseract and Shockwave"
        fetchpriority="high"
        decoding="async"
      />

      <!-- Clickable regions over each motorcycle (percentage-based). -->
      <a
        class="hero__hotspot hero__hotspot--tesseract"
        href="../bikes/tesseract/"
        aria-label="Tesseract — view variants"
      ></a>
      <a
        class="hero__hotspot hero__hotspot--shockwave"
        href="../bikes/shockwave/"
        aria-label="Shockwave — view variants"
      ></a>
    </div>

    <!-- Circular arrow button, centre-left — returns to the first homepage. -->
    <a class="hero-arrow hero-arrow--left" href="../" aria-label="Back to the first lineup">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M19 12H6M12 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </a>
  </section>
</body>
</html>
